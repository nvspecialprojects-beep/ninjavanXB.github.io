<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple JavaScript CRUD Application</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 30px;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
            background: #fafafa;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        input[type="text"], input[type="email"] {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        button {
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #007bff;
            color: white;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        .btn-edit {
            background-color: #ffc107;
            color: #212529;
            margin-right: 5px;
        }
        .btn-edit:hover {
            background-color: #e0a800;
        }
        .btn-delete {
            background-color: #dc3545;
            color: white;
        }
        .btn-delete:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>User Management (CRUD)</h2>
    
    <!-- CREATE / UPDATE FORM -->
    <form id="userForm">
        <!-- Hidden input tracking index when editing a record -->
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group">
            <label for="userName">Full Name</label>
            <input type="text" id="userName" placeholder="Enter full name" required>
        </div>
        <div class="form-group">
            <label for="userEmail">Email Address</label>
            <input type="email" id="userEmail" placeholder="Enter email address" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Add User</button>
    </form>

    <!-- READ DATA TABLE -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <!-- Dynamic rows will be added here -->
        </tbody>
    </table>
</div>

<script>
    // App State: Initial sample records array
    let users = [
        { name: "Alice Johnson", email: "alice@example.com" },
        { name: "Bob Smith", email: "bob@example.com" }
    ];

    // DOM Elements
    const userForm = document.getElementById('userForm');
    const userNameInput = document.getElementById('userName');
    const userEmailInput = document.getElementById('userEmail');
    const editIndexInput = document.getElementById('editIndex');
    const submitBtn = document.getElementById('submitBtn');
    const userTableBody = document.getElementById('userTableBody');

    // READ: Render data array into the HTML table
    function renderTable() {
        userTableBody.innerHTML = '';
        
        if (users.length === 0) {
            userTableBody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No records found.</td></tr>`;
            return;
        }

        users.forEach((user, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${index + 1}</td>
                <td>${user.name}</td>
                <td>${user.email}</td>
                <td>
                    <button class="btn-edit" onclick="editUser(${index})">Edit</button>
                    <button class="btn-delete" onclick="deleteUser(${index})">Delete</button>
                </td>
            `;
            userTableBody.appendChild(row);
        });
    }

    // CREATE or UPDATE logic handler
    userForm.addEventListener('submit', function(e) {
        e.preventDefault(); // Stop page reload

        const name = userNameInput.value.trim();
        const email = userEmailInput.value.trim();
        const editIndex = parseInt(editIndexInput.value);

        if (editIndex === -1) {
            // CREATE operation: Add new entry to the array
            users.push({ name, email });
        } else {
            // UPDATE operation: Modify existing entry
            users[editIndex] = { name, email };
            editIndexInput.value = "-1"; // Reset form state flag
            submitBtn.textContent = "Add User";
            submitBtn.style.backgroundColor = "#28a745";
        }

        userForm.reset();
        renderTable();
    });

    // UPDATE: Populate form values to start edit mode
    function editUser(index) {
        userNameInput.value = users[index].name;
        userEmailInput.value = users[index].email;
        editIndexInput.value = index; // Store targeting index
        
        submitBtn.textContent = "Update User";
        submitBtn.style.backgroundColor = "#007bff";
    }

    // DELETE: Remove record by index array filtering
    function deleteUser(index) {
        if (confirm("Are you sure you want to delete this user?")) {
            users.splice(index, 1);
            
            // If deleting a row that is currently being edited, reset form
            if (parseInt(editIndexInput.value) === index) {
                userForm.reset();
                editIndexInput.value = "-1";
                submitBtn.textContent = "Add User";
                submitBtn.style.backgroundColor = "#28a745";
            }
            
            renderTable();
        }
    }

    // Initial table call on script load
    renderTable();
</script>

</body>
</html>

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!--Button for Add Shipment-->
<div class="container">
  <button id="formToggleBtn" class="addShipment-btn">Add Shipment</button> 
    
 <!-- DATA TABLE-->
 <table> 
        <thead>
            <tr>
                <th>ID</th>
                <th>MAWB #</th>
                <th>Account</th>
                <th>Time of Arrival</th>
                <th>No. of pcs</th>
                <th>Special Instructions</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="userTableBody">
            <!-- Dynamic rows will be added here -->
        </tbody>
    </table>
    
<!-- DATA FORM --->
<div id="floatingForm" class="signup-container">    
<form id="userForm">
        <!-- Hidden input tracking index when editing a record -->
        <input type="hidden" id="editIndex" value="-1">
        
        <div class="form-group">
            <label for="userMawb">MAWB #</label>
            <input type="text" id="mawb" placeholder="Enter Mawb#" required>
        </div>
        <div class="form-group">
            <label for="userAccount">Account</label>
            <select type="" id="account" placeholder="Select account" required>
              <option value="#" ></option>
              <option value="CN-PH">CNPH</option>
              <option value="LAZADA-DVO">Lazada DVO</option>
              <option value="CEB-JNT">Cebu J&T</option>
              <option value="JNT-DVO">JNT DVO</option>
              <option value="IHERB">IHERB</option>
              <option value="NIKE">NIKE</option>
          </select>
        </div>
        <div class="form-group">
            <label for="userArrival">Time of Arrival</label>
            <input type="time" id="arrival" placeholder="" required>
        </div>
        <div class="form-group">
            <label for="userPcs">No. of pcs</label>
            <input type="number" id="pcs" placeholder="" required>
        </div>
        <div class="form-group">
            <label for="userInstruction">Special Instructions</label>
            <input type="text" id="instruction" placeholder="Enter instruction" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-submit">Submit</button>
        <button type="button" id="closeBtn" class="btn-close">Close</button>
        
</form>
</div>
</div>
</body>
<script src="script.js" defer></script>
</html>
